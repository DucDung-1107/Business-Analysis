[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-churn-capstone"
version = "0.1.0"
description = "Contract-first team backbone for a digital-bank churn capstone"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pydantic>=2.7,<3",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "streamlit>=1.40,<2",
  "httpx>=0.27,<1", "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
churn = "churn_capstone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
